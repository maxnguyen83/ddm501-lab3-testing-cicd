# =============================================================================
# CI Pipeline for Movie Rating API
# DDM501 - Lab 3: Testing & CI/CD
#
# lint ──┐
#        ├─> test (3.10, 3.12) ──> docker (build + smoke test)
# type ──┘
#
# - No secrets are needed. Coverage is published as a job summary and an
#   artifact instead of Codecov (which would need a token).
# - The model is trained inside the workflow (models/*.pkl is gitignored),
#   and the docker job reuses the exact model the tests ran against.
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"  # same as the Dockerfile base image

jobs:
  # ===========================================================================
  # Linting Job
  # ===========================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters (versions pinned in requirements-dev.txt)
        run: |
          python -m pip install --upgrade pip
          grep -E '^(black|isort|flake8)==' requirements-dev.txt | xargs pip install

      - name: Run flake8
        run: flake8 app/ tests/ scripts/

      - name: Check black formatting
        run: black --check --diff app/ tests/ scripts/

      - name: Check import sorting
        run: isort --check-only --diff app/ tests/ scripts/

  # ===========================================================================
  # Type Checking Job
  # ===========================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          grep -E '^(mypy|types-requests)==' requirements-dev.txt | xargs pip install

      - name: Run mypy
        run: mypy app/ scripts/

  # ===========================================================================
  # Test Job
  # ===========================================================================
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = production image, 3.12 = team dev machines
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Cache MovieLens 100K
        uses: actions/cache@v4
        with:
          path: ~/.surprise_data
          key: movielens-100k-v1

      - name: Train model
        run: python scripts/train_model.py

      - name: Run tests with coverage
        run: >-
          pytest tests/
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --cov-fail-under=80
          --junitxml=reports/junit.xml

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            reports/junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload trained model (for the docker job)
        if: matrix.python-version == env.PYTHON_VERSION
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/svd_model.pkl
            models/metrics.json
          retention-days: 7

  # ===========================================================================
  # Build Job: the image must build and serve predictions
  # ===========================================================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, type-check]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download tested model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Build Docker image
        run: docker build -t movie-rating-api:test .

      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name test-api movie-rating-api:test
          # Wait for the Docker HEALTHCHECK (model_loaded == true)
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' test-api)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          [ "$status" = "healthy" ] || { docker logs test-api; exit 1; }
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"user_id": "196", "movie_id": "242"}'

      - name: Stop container
        if: always()
        run: docker rm -f test-api || true
