# =============================================================================
# Model Validation for Movie Rating API
# DDM501 - Lab 3: Testing & CI/CD
#
# Runs whenever something that can change the model changes:
#   data checks  ->  train  ->  performance thresholds  ->  behavioural tests
#
# The starter listed 'pipeline/**', which does not exist in this repo; the
# training code lives in scripts/. A weekly schedule also retrains, because
# unpinned transitive dependencies (scipy, joblib) can shift results.
# =============================================================================

name: Model Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'models/**'
      - 'scripts/**'
      - 'app/model.py'
      - 'app/config.py'
      - 'requirements.txt'
      - 'tests/data/**'
      - 'tests/model/**'
      - '.github/workflows/model-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'models/**'
      - 'scripts/**'
      - 'app/model.py'
      - 'app/config.py'
      - 'requirements.txt'
      - 'tests/data/**'
      - 'tests/model/**'
      - '.github/workflows/model-validation.yml'
  schedule:
    - cron: '0 3 * * 1'  # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-model:
    name: Validate Model
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Cache MovieLens 100K
        uses: actions/cache@v4
        with:
          path: ~/.surprise_data
          key: movielens-100k-v1

      # Gate 1: never train on data that breaks the data contract
      - name: Data quality checks (before training)
        run: pytest tests/data/ -q

      - name: Train model
        run: python scripts/train_model.py

      # Gate 2: held-out (5-fold CV) metrics must meet the thresholds
      - name: Validate model performance
        run: python -m scripts.validate_model --max-rmse 0.95 --max-mae 0.75

      # Gate 3: invariance / directional / minimum-functionality behaviour
      - name: Behavioural tests on the trained model
        run: pytest tests/model/ -q

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: models/metrics.json
          retention-days: 30
          if-no-files-found: warn
