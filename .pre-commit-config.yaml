# =============================================================================
# Pre-commit hooks configuration
# DDM501 - Lab 3: Testing & CI/CD
#
# Setup (installs both the pre-commit and the pre-push hook):
#   pip install -r requirements-dev.txt
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files                      # commit-stage hooks
#   pre-commit run --all-files --hook-stage pre-push  # unit tests
#
# Tool versions match requirements-dev.txt so local hooks and CI agree.
# Settings come from pyproject.toml (black, isort, mypy) and .flake8.
# =============================================================================

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # ===========================================================================
  # Standard pre-commit hooks
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # ===========================================================================
  # Black formatter
  # ===========================================================================
  # No language_version pin: pinning python3.10 breaks on machines that only
  # have 3.12. Black's target version is set in pyproject.toml instead.
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black

  # ===========================================================================
  # isort for import sorting (profile=black, line_length=100 in pyproject)
  # ===========================================================================
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  # ===========================================================================
  # Flake8 linter (settings in .flake8)
  # ===========================================================================
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8

  # ===========================================================================
  # mypy type checker (app/ and scripts/, same scope as CI)
  # ===========================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        files: ^(app|scripts)/
        additional_dependencies:
          - pydantic==2.5.2
          - fastapi==0.104.1
          - numpy==1.26.2
          - types-requests

  # ===========================================================================
  # pytest unit tests on push (too slow for every commit)
  # ===========================================================================
  # Runs in the active virtualenv (language: system), so activate .venv first.
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit tests)
        entry: python -m pytest tests/unit/ -q --no-cov -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
